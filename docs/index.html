<!DOCTYPE html>
<html>
  <head>
    <title>EZ Vault</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://44billion.github.io/ez-vault" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link href="./styles/reset.css" rel="stylesheet" />
    <link href="./styles/theme.css" rel="stylesheet" />
    <link href="./styles/global.css" rel="stylesheet" />
    <link href="./styles/index.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Boot gate: #vault starts hidden so a lock/create overlay never has
         to cover an already-painted vault screen. index.js reveals it after
         the overlay components decide their visibility; there is deliberately
         no load-based failsafe (the vault fails closed if the module graph
         fails to load). -->
    <div id="vault" style="visibility: hidden">
      <div id="update-banner" hidden>
        <span class="update-banner-text">Update available</span>
        <button id="update-banner-apply" type="button" class="update-banner-button">Update</button>
      </div>
      <section class="accounts-section">
        <div class="accounts-header">
          <div class="accounts-actions">
            <button id="create-account-btn" type="button" class="primary-action">
              <span class="glyph"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg></span>
              <span data-i18n="new-account">New Account</span>
            </button>
            <button id="add-account-btn" type="button" class="primary-action">
              <span class="glyph"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l0 14" /><path d="M16 15l-4 4" /><path d="M8 15l4 4" /></svg></span>
              <span class="text-full" data-i18n="add-account">Add Account</span>
              <span class="text-short" data-i18n="add">Add</span>
            </button>
            <button id="sync-devices-btn" type="button" class="primary-action">
              <span class="glyph"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9a1 1 0 0 1 1 -1h6a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-6a1 1 0 0 1 -1 -1v-10z" /><path d="M18 8v-3a1 1 0 0 0 -1 -1h-13a1 1 0 0 0 -1 1v12a1 1 0 0 0 1 1h9" /><path d="M16 9h2" /></svg></span>
              <span class="text-full" data-i18n="sync-devices">Sync Devices</span>
              <span class="text-short" data-i18n="sync">Sync</span>
            </button>
          </div>
          <account-add></account-add>
          <sync-panel></sync-panel>
        </div>
        <account-list class="accounts-list"></account-list>
      </section>
      <section class="diagnostics-section">
        <accordion-panel header="Trusted devices" data-i18n-header="trusted-devices" icon="devices">
          <trusted-signers-panel></trusted-signers-panel>
        </accordion-panel>
        <accordion-panel header="Activity log" data-i18n-header="activity-log" icon="activity">
          <activity-log></activity-log>
        </accordion-panel>
      </section>
      <vault-lock-button hidden></vault-lock-button>
    </div>
    <lock-overlay hidden></lock-overlay>
    <create-overlay hidden></create-overlay>
    <div id="boot-failed-overlay" hidden>
      <style>
        #boot-failed-overlay {
          position: fixed;
          inset: 0;
          z-index: 2147483647;
          display: grid;
          place-items: center;
          background: var(--surface);
          color: var(--fg);
        }
        #boot-failed-overlay[hidden] {
          display: none;
        }
        .boot-failed-card {
          max-width: 340px;
          margin: 16px;
          padding: 24px;
          border-radius: 10px;
          background: var(--surface-raised);
          font-family: system-ui, sans-serif;
          text-align: center;
        }
        .boot-failed-card p {
          margin: 0 0 18px;
          font-size: 15rem;
          line-height: 1.45;
        }
        .boot-failed-card button {
          min-height: 40px;
          padding: 8px 18px;
          border: none;
          border-radius: 8px;
          background: var(--accent);
          color: var(--fg-on-accent);
          font-size: 14rem;
          cursor: pointer;
        }
        .boot-failed-card button:active {
          background: var(--accent-active);
        }
      </style>
      <div class="boot-failed-card">
        <p data-boot-failed-message>Vault failed to load. Reload?</p>
        <button type="button" data-boot-failed-reload>Reload</button>
      </div>
    </div>
    <script>
      // Boot failsafe, inlined into index.html by bin/build.js (no module
      // dependencies). #vault starts hidden and index.js reveals it only after the
      // module graph initializes. If a deploy serves a stale index.html that
      // references chunks that no longer exist, the module graph fails and the page
      // would stay blank (CSS still paints). This script logs script errors,
      // recovers once per session with an automatic reload, and then shows a manual
      // reload overlay instead of a blank page.
      (function () {
        const BOOT_TIMEOUT_MS = 12000
        const POLL_MS = 1000
        const FLAG = 'ezVaultBootAutoReloaded'
        let vaultEl = null
        let overlayEl = null
        const startedAt = Date.now()
      
        function storageGet () {
          try {
            return window.sessionStorage.getItem(FLAG) === '1'
          } catch {
            return false
          }
        }
        function storageSet (value) {
          try {
            if (value) window.sessionStorage.setItem(FLAG, '1')
            else window.sessionStorage.removeItem(FLAG)
          } catch {
            // sessionStorage may be unavailable (private mode, blocked storage)
          }
        }
      
        function isBooted () {
          if (!vaultEl) vaultEl = document.getElementById('vault')
          return Boolean(vaultEl && vaultEl.style && vaultEl.style.visibility === 'visible')
        }
      
        function showOverlay () {
          if (!overlayEl) overlayEl = document.getElementById('boot-failed-overlay')
          if (!overlayEl) return
          const lang = (navigator.language || 'en').toLowerCase()
          const isPt = lang === 'pt' || lang.startsWith('pt-')
          const messageEl = overlayEl.querySelector('[data-boot-failed-message]')
          if (messageEl) {
            messageEl.textContent = isPt ? 'Falha ao carregar o vault. Recarregar?' : 'Vault failed to load. Reload?'
          }
          const button = overlayEl.querySelector('[data-boot-failed-reload]')
          if (button) {
            button.onclick = () => {
              storageSet(false)
              window.location.reload()
            }
          }
          overlayEl.hidden = false
        }
      
        window.addEventListener('error', event => {
          console.warn('[vault-boot] script error:', event.message || event.type, event.filename || window.location.href, event.lineno || '')
        })
        window.addEventListener('unhandledrejection', event => {
          console.warn('[vault-boot] unhandled rejection:', event.reason)
        })
      
        const intervalId = setInterval(() => {
          if (isBooted()) {
            clearInterval(intervalId)
            return
          }
          if (Date.now() - startedAt < BOOT_TIMEOUT_MS) return
      
          clearInterval(intervalId)
          if (!storageGet()) {
            // First failure this session: one automatic reload. index.js clears the
            // flag on a successful boot so the next real failure gets its automatic
            // attempt again.
            storageSet(true)
            console.warn('[vault-boot] vault did not boot in ' + BOOT_TIMEOUT_MS + 'ms; reloading once', window.location.href)
            window.location.reload()
            return
          }
          console.warn('[vault-boot] vault still did not boot after the automatic reload; showing manual reload', window.location.href)
          showOverlay()
        }, POLL_MS)
      })()
    </script>
    <script>
      // Early service worker registration, inlined into index.html by bin/build.js
      // before the module graph loads, so the very next reload is already
      // controlled: network-first revalidation then bypasses GitHub Pages'
      // 10-minute browser cache for index.html/app.js. Skipped on localhost and
      // non-https (dev/peer servers); sw-manager still handles updates and, in dev,
      // unregisters any leftover workers.
      (function () {
        if (typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return
        const hostname = window.location.hostname || ''
        const isLocalhost = hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '[::1]' || hostname.endsWith('.localhost')
        if (isLocalhost || window.location.protocol !== 'https:') return
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(err => {
          console.warn('[ez-vault-sw] early registration failed:', err?.message ?? err)
        })
      })()
    </script>
  </body>
<script type="module" src="./app.js"></script>
</html>
