<!DOCTYPE html>
<html>
  <head>
    <title>EZ Vault</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://44billion.github.io/ez-vault" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link href="./styles/reset.css" rel="stylesheet" />
    <link href="./styles/theme.css" rel="stylesheet" />
    <link href="./styles/global.css" rel="stylesheet" />
    <link href="./styles/index.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Boot gate: #vault starts hidden so a lock/create overlay never has
         to cover an already-painted vault screen. index.js reveals it after
         the overlay components decide their visibility; there is deliberately
         no load-based failsafe (the vault fails closed if the module graph
         fails to load). -->
    <div id="vault" style="visibility: hidden">
      <div id="update-banner" hidden>
        <span class="update-banner-text">Update available</span>
        <button id="update-banner-apply" type="button" class="update-banner-button">Update</button>
      </div>
      <section class="accounts-section">
        <div class="accounts-header">
          <div class="accounts-actions">
            <button id="create-account-btn" type="button" class="primary-action">
              <span class="glyph"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg></span>
              <span data-i18n="new-account">New Account</span>
            </button>
            <button id="add-account-btn" type="button" class="primary-action">
              <span class="glyph"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l0 14" /><path d="M16 15l-4 4" /><path d="M8 15l4 4" /></svg></span>
              <span class="text-full" data-i18n="add-account">Add Account</span>
              <span class="text-short" data-i18n="add">Add</span>
            </button>
            <button id="sync-devices-btn" type="button" class="primary-action">
              <span class="glyph"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9a1 1 0 0 1 1 -1h6a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-6a1 1 0 0 1 -1 -1v-10z" /><path d="M18 8v-3a1 1 0 0 0 -1 -1h-13a1 1 0 0 0 -1 1v12a1 1 0 0 0 1 1h9" /><path d="M16 9h2" /></svg></span>
              <span class="text-full" data-i18n="sync-devices">Sync Devices</span>
              <span class="text-short" data-i18n="sync">Sync</span>
            </button>
          </div>
          <account-add></account-add>
          <sync-panel></sync-panel>
        </div>
        <account-list class="accounts-list"></account-list>
      </section>
      <section class="diagnostics-section">
        <accordion-panel header="Trusted devices" data-i18n-header="trusted-devices" icon="devices">
          <trusted-signers-panel></trusted-signers-panel>
        </accordion-panel>
        <accordion-panel header="Activity log" data-i18n-header="activity-log" icon="activity">
          <activity-log></activity-log>
        </accordion-panel>
      </section>
      <vault-lock-button hidden></vault-lock-button>
    </div>
    <lock-overlay hidden></lock-overlay>
    <create-overlay hidden></create-overlay>
    <div id="boot-failed-overlay" hidden>
      <!-- inject:boot-failsafe-css -->
      <div class="boot-failed-card">
        <p data-boot-failed-message>Vault failed to load. Reload?</p>
        <button type="button" data-boot-failed-reload>Reload</button>
      </div>
    </div>
    <!-- inject:boot-failsafe-js -->
    <!-- inject:sw-bootstrap-js -->
  </body>
<script type="module" src="./app.js"></script>
</html>
